<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIA</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <form id="fetchForm" class="compact-form">
                <div class="row row-70-30">
                    <div class="form-group">
                        <label for="query">Query:</label>
                            <input type="text" id="query" name="query" value="food safety AND microbiome">
                    </div>
                    <div class="form-group">
                        <label for="max_records">Max:</label>
                            <input type="number" id="max_records" name="max_records" value="150">
                    </div>
                </div>
                <div class="row row-100-0">
                    <!-- <div class="form-group">
                        <label for="mindate">Start Year:</label>
                        <input type="text" id="mindate" name="mindate" value="2022">
                    </div>
                    <div class="form-group">
                        <label for="maxdate">End Year:</label>
                        <input type="text" id="maxdate" name="maxdate" value="2024">
                    </div> -->
                    <div class="form-group">
                        <label for="presentdate">Present year:</label>
                            <input type="text" id="presentdate" name="presentdate" value="2024">
                    </div>
                </div>
                <button type="submit">Fetch Articles</button>
            </form>
            <div id="results" class="results-container">
                <div id="oldArticlesContainer" class="articles-container"></div>
                <div id="newArticlesContainer" class="articles-container"></div>
            </div>
        </div>
        <div class="middle-section">
            <button id="clusterAndNameButton">Analyze</button>
            <div class="slider-value-container">
                    <span id="sliderLabel">Strength of cluster fusion: </span><span id="sliderValue">0.97</span>
                    <input type="range" id="gradientSlider" class="gradient-slider" min="0.90" max="1" step="0.005" value="0.97">
            </div>            
             <div id="clusterResults"></div>
            <div id="clusterNames" class="cluster-names"></div>
            <div id="threejs-container"></div>
        </div>
        <div class="right-section">
            <button id="generateTrendsButton">Generate Trends</button>
            <div id="trendFilters" class="filter-container">
                <div class="filter-item">
                    <label for="importanceDegreeFilter" class="filter-label">Importance Degree:</label>
                    <select id="importanceDegreeFilter" class="filter-select">
                        <option value="All">All</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
            
                <div class="filter-item">
                    <label for="categoryFilter" class="filter-label">Category:</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="All">All</option>
                        <option value="Emerging Topic">Emerging topic</option>
                        <option value="Consumer Behavior and Consumption">Consumer behavior and consumption</option>
                        <option value="Technological Advances">Technological advances</option>
                        <option value="Methodological Innovations">Methodological innovations</option>
                        <!-- Add more categories as needed -->
                    </select>
                </div>
            </div>                     
            <div id="trendResults" class="trend-results-container"></div>
        </div>        
    </div>
    <div id="loading-spinner" class="spinner"></div>
    <script type="module" src="js/main.js?v=4"></script>
</body>
</html>
